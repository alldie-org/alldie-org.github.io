<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLDIE</title>
    <style>
        /* 기본 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #fcfbf9; }

        /* 대문 레이아웃 */
        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease-in-out;
        }

        /* 미니멀 모노그램 (SVG 또는 이미지 배치 공간) */
        .monogram {
            width: 120px;
            height: auto;
            opacity: 0.85;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        /* 마우스 오버 시 미세한 반응 */
        .splash-container:hover .monogram {
            transform: scale(1.02);
            opacity: 1;
        }

        /* 전환 시 서서히 사라지는 효과 */
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 대문 영역 -->
    <div class="splash-container" id="splash" onclick="enterSite()">
        <!-- 여기에 아까 만든 소문자 ad 모노그램 이미지 경로를 넣으면 돼 -->
        <img src="your-monogram-path.png" alt="ad" class="monogram">
    </div>

    <script>
        function enterSite() {
            const splash = document.getElementById('splash');
            splash.classList.add('fade-out');
            
            // 0.8초 후 메인 페이지(main.html)로 이동
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 800);
        }
    </script>
</body>
</html>
