<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLDIE</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <style>
        /* 컨테이너 및 전체 레이아웃 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        .splash-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 40px;
            box-sizing: border-box;
        }

        /* 헤더 영역: alldie는 좌측, 나머지 정보는 우측으로 배치하기 위한 Flexbox */
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            width: 100%;
        }

        /* 왼쪽 alldie 로고 */
        .text-logo {
            font-size: 1rem;
            letter-spacing: 0.05em;
        }

        /* 우측으로 보낼 작가명 및 링크 그룹 */
        .header-right-group {
            text-align: right;
        }

        .subtext-logo {
            font-size: 0.9rem;
            color: #fff;
        }

        .links-container {
            margin-top: 6px;
            display: flex;
            gap: 10px;
            justify-content: flex-end; /* 우측 정렬 */
            align-items: center;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .links-container a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .links-container a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .links-container span {
            color: #444;
        }

        /* 비메오 비디오 영역: 폭 100% 꽉 채우고 16:9 비율 유지 */
        .video-wrapper {
            width: 100%;
            max-width: 100%;
            padding-top: 56.25%; /* 16:9 비율 유지 */
            position: relative;
            margin-top: 12px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 영상 하단 외부 캡션 및 토글 버튼 영역 (페이드인 적용) */
        .video-info-box {
            width: 100%;
            margin-top: 10px;
            text-align: right;
            opacity: 0;
            animation: fadeInCaption 2.2s ease-in-out forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeInCaption {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-caption {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.02em;
        }

        /* 오직 작품 제목만 이탤릭체 적용 */
        .video-caption span {
            font-style: italic;
            color: #fff;
        }

        /* 음소거 토글 버튼 스타일 */
        .audio-toggle-btn {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.75rem;
            color: #888;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .audio-toggle-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="splash-container" id="splash">
        <div class="header-info">
            <!-- 좌측 상단 alldie -->
            <div class="text-logo">alldie</div>
            
            <!-- 우측 상단으로 이동한 작가명 및 링크 그룹 -->
            <div class="header-right-group">
                <div class="subtext-logo">모토코 + 하상철</div>
                <div class="links-container">
                    <a href="https://instagram.com/motoko.v_s" target="_blank" onclick="event.stopPropagation();">IG: @motoko.v_s</a>
                    <span>|</span>
                    <a href="https://instagram.com/hasc.default" target="_blank" onclick="event.stopPropagation();">IG: @hasc.default</a>
                    <span>|</span>
                    <a href="mailto:info@alldie.org" onclick="event.stopPropagation();">Mail: info@alldie.org</a>
                </div>
            </div>
        </div>

        <!-- 비메오 임베드 영역 -->
        <div class="video-wrapper">
            <iframe 
                id="vimeo-player"
                src="https://player.vimeo.com/video/1219159064?h=dff0dff341&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1&amp;controls=0&amp;background=1" 
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                title="SignalScopeSociety-Exhibition-Doc-20260404-0419-Faction">
            </iframe>
        </div>

        <!-- 영상 바깥 우측 하단 캡션 및 sound 버튼 -->
        <div class="video-info-box">
            <div class="video-caption">
                <span>Signal Scope Society</span> (2026)
            </div>
            <div>
                <button id="audio-btn" class="audio-toggle-btn" onclick="toggleAudio()">[sound on]</button>
            </div>
        </div>
    </div>

    <!-- 비메오 API 스크립트 -->
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var iframe = document.getElementById('vimeo-player');
            if (iframe && typeof Vimeo !== 'undefined') {
                var player = new Vimeo.Player(iframe);

                // 영상 종료 시 강제 0초 이동 및 무한 루프
                player.on('ended', function() {
                    player.setCurrentTime(0).then(function() {
                        player.play();
                    });
                });
            }
        });

        // 음소거 토글 함수
        function toggleAudio() {
            var iframe = document.getElementById('vimeo-player');
            var btn = document.getElementById('audio-btn');
            
            if (iframe && typeof Vimeo !== 'undefined') {
                var player = new Vimeo.Player(iframe);
                
                player.getMuted().then(function(muted) {
                    if (muted) {
                        player.setMuted(false);
                        player.setVolume(1);
                        btn.textContent = '[sound off]';
                    } else {
                        player.setMuted(true);
                        btn.textContent = '[sound on]';
                    }
                }).catch(function(error) {
                    console.log("Audio toggle error:", error);
                });
            }
        }
    </script>

</body>
</html>
