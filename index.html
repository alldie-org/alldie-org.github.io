<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLDIE</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <style>
        /* 비메오 비디오 컨테이너 세팅 (필요시 style.css로 이동 가능) */
        .video-wrapper {
            width: 100%;
            max-width: 800px; /* 비디오의 최대 너비 제한 (필요에 따라 조절) */
            margin: 24px auto 0 auto; /* 위쪽 로고와의 간격 및 중앙 정렬 */
            padding: 56.25% 0 0 0;
            position: relative;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="splash-container" id="splash" onclick="enterSite()">
        <div class="text-logo">alldie</div>
        <div class="subtext-logo">모토코 + 하상철</div>

        <!-- 비메오 임베드 영역 -->
        <div class="video-wrapper">
            <iframe 
                src="https://player.vimeo.com/video/1219213776?h=4400af376b&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1" 
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                title="ALLDIE Video">
            </iframe>
        </div>
    </div>

    <!-- 비메오 API 스크립트 -->
    <script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
