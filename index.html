<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLDIE</title>
    <style>
        /* 기본 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background-color: #fcfbf9; }

        /* 대문 레이아웃 */
        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease-in-out;
        }

        /* 미니멀 텍스트 스타일 */
        .text-logo {
            font-size: 24px;
            font-weight: 300;
            color: #111;
            letter-spacing: -0.03em;
            user-select: none;
            opacity: 0.7;
            transition: opacity 0.4s ease, letter-spacing 0.4s ease;
        }

        /* 마우스 올렸을 때 드라이한 반응 */
        .splash-container:hover .text-logo {
            opacity: 1;
            letter-spacing: 0.02em; /* 미세하게 자간이 벌어지는 효과 */
        }

        /* 전환 시 페이드아웃 */
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 클릭하면 enterSite 함수가 실행됨 -->
    <div class="wrapper">
        <div class="splash-container" id="splash" onclick="enterSite()">
            <div class="text-logo">alldie</div>
        </div>
    </div>

    <script>
        function enterSite() {
            const splash = document.getElementById('splash');
            splash.classList.add('fade-out');
            
            // 0.6초 페이드아웃 애니메이션이 끝난 후 메인으로 이동
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 600);
        }
    </script>
</body>
</html>
