<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLDIE</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <style>
        /* 컨테이너 및 전체 레이아웃 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        .splash-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 16px;
            box-sizing: border-box;
        }

        /* 헤더 / 프로필 정보 영역 */
        .header-info {
            text-align: center;
            margin-bottom: 20px;
        }

        /* 캡션 및 외부 링크 영역 */
        .meta-info {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 0.02em;
        }

        .meta-info span {
            color: #ccc;
        }

        .links-container {
            margin-top: 10px;
            display: flex;
            gap: 16px;
            justify-content: center;
            font-size: 0.85rem;
        }

        .links-container a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .links-container a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* 비메오 비디오 영역: 폭 100% 꽉 채우고 16:9 비율 유지 */
        .video-wrapper {
            width: 100%;
            max-width: 100%;
            padding-top: 56.25%; /* 16:9 비율 유지 */
            position: relative;
            margin-top: 16px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="splash-container" id="splash" onclick="enterSite()">
        <div class="header-info">
            <div class="text-logo">alldie</div>
            <div class="subtext-logo">모토코 + 하상철</div>
            
            <!-- 작품 캡션 정보 -->
            <div class="meta-info">
                <span>Signal Scope Society</span> (2026, Faction)
            </div>

            <!-- 심사위원용 최소 외부 링크 (주소는 네 계정에 맞게 수정) -->
            <div class="links-container">
                <a href="https://instagram.com/motoko.v_s" target="_blank" onclick="event.stopPropagation();">IG: @motoko.v_s</a>
                <span>|</span>
                <a href="https://instagram.com/hasc.default" target="_blank" onclick="event.stopPropagation();">IG: @hasc.default</a>
                <span>|</span>
                <a href="mailto:info@alldie.org" onclick="event.stopPropagation();">Contact</a>
            </div>
        </div>

        <!-- 비메오 임베드 영역 -->
        <div class="video-wrapper">
            <iframe 
                id="vimeo-player"
                src="https://player.vimeo.com/video/1219159064?h=dff0dff341&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=0&amp;loop=1&amp;controls=0&amp;background=1" 
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                title="SignalScopeSociety-Exhibition-Doc-20260404-0419-Faction">
            </iframe>
        </div>
    </div>

    <!-- 비메오 API 스크립트 및 루프/음소거 해제 스크립트 -->
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var iframe = document.getElementById('vimeo-player');
            if (iframe && typeof Vimeo !== 'undefined') {
                var player = new Vimeo.Player(iframe);

                // 영상 종료 시 강제 0초 이동 및 무한 루프
                player.on('ended', function() {
                    player.setCurrentTime(0).then(function() {
                        player.play();
                    });
                });
            }
        });

        function enterSite() {
            var iframe = document.getElementById('vimeo-player');
            if (iframe && typeof Vimeo !== 'undefined') {
                var player = new Vimeo.Player(iframe);
                player.setVolume(1);
                player.play().catch(function(error) {
                    console.log("Vimeo play error:", error);
                });
            }
        }
    </script>

</body>
</html>
