<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLDIE</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <style>
        /* 컨테이너 및 전체 레이아웃 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-x: hidden;
        }

        .splash-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
            box-sizing: border-box;
        }

        /* 비메오 비디오 영역: 폭 100% 꽉 채우고 16:9 비율 유지 */
        .video-wrapper {
            width: 100%;
            max-width: 100%;
            padding-top: 56.25%; /* 16:9 비율 유지 */
            position: relative;
            margin-top: 24px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="splash-container" id="splash" onclick="enterSite()">
        <div class="text-logo">alldie</div>
        <div class="subtext-logo">모토코 + 하상철</div>

        <!-- 비메오 임베드 영역 -->
        <div class="video-wrapper">
            <iframe 
                id="vimeo-player"
                src="https://player.vimeo.com/video/1219159064?h=dff0dff341&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=0&amp;loop=1&amp;controls=0&amp;background=1" 
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                title="SignalScopeSociety-Exhibition-Doc-20260404-0419-Faction">
            </iframe>
        </div>
    </div>

    <!-- 비메오 API 스크립트 -->
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var iframe = document.getElementById('vimeo-player');
            if (iframe && typeof Vimeo !== 'undefined') {
                var player = new Vimeo.Player(iframe);

                // 영상이 끝났을 때 다시 0초부터 재생하도록 루프 강제 적용
                player.on('ended', function() {
                    player.setCurrentTime(0).then(function() {
                        player.play();
                    });
                });
            }
        });

        function enterSite() {
            var iframe = document.getElementById('vimeo-player');
            if (iframe && typeof Vimeo !== 'undefined') {
                var player = new Vimeo.Player(iframe);
                player.setVolume(1);
                player.play().catch(function(error) {
                    console.log("Vimeo play error:", error);
                });
            }
        }
    </script>

</body>
</html>
